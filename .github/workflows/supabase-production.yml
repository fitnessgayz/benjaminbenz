name: Audit hosted GRUNTR email artwork
on: workflow_dispatch
permissions: {}
jobs:
  auth-logo-audit:
    if: github.repository == 'fitnessgayz/benjaminbenz' && github.ref == 'refs/heads/codex/gruntr-single-g-auth-audit'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 3
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEPLOY_TOKEN }}
    steps:
      - name: Inspect only email artwork references
        run: |
          python3 - <<'PY'
          import json, os, re, urllib.request
          from html.parser import HTMLParser
          from urllib.parse import urlparse

          class Artwork(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
                  self.inline_drawings = 0
              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  if tag == 'img' and values.get('src'):
                      self.refs.append(values['src'])
                  if tag == 'svg':
                      self.inline_drawings += 1
                  if values.get('background'):
                      self.refs.append(values['background'])

          token = os.environ.get('SUPABASE_ACCESS_TOKEN', '')
          if not token:
              raise SystemExit('The existing Supabase deployment token was unavailable')
          request = urllib.request.Request(
              'https://api.supabase.com/v1/projects/qukdfjeupjhpthfbaonv/config/auth',
              headers={'Authorization': f'Bearer {token}', 'Accept': 'application/json'},
          )
          with urllib.request.urlopen(request, timeout=20) as reply:
              auth = json.load(reply)
          templates = {key:value for key,value in auth.items() if key.startswith('mailer_templates_') and key.endswith('_content')}
          if not templates:
              raise SystemExit('No hosted email template content was returned')
          for key, raw in sorted(templates.items()):
              source = raw or ''
              artwork = Artwork()
              artwork.feed(source)
              artwork.refs += re.findall(r'url\(\s*["\']?([^\s\)"\']+)', source)
              first_party = []
              for reference in artwork.refs:
                  target = urlparse(reference)
                  if target.hostname in {'benjaminbenz.com','www.benjaminbenz.com'} and re.fullmatch(r'/[a-zA-Z0-9./_-]+', target.path):
                      first_party.append(target.path)
              print(json.dumps({'template':key, 'firstPartyArtwork':first_party,
                                'otherImageRefs':len(artwork.refs)-len(first_party),
                                'inlineDrawings':artwork.inline_drawings}))
          PY
