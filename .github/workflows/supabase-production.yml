name: Upload corrected Seated Dip Machine media

on: workflow_dispatch

permissions:
  contents: read

jobs:
  upload-seated-dip:
    if: github.repository == 'fitnessgayz/benjaminbenz' && github.ref == 'refs/heads/codex/seated-dip-media-publish'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: production
    env:
      SUPABASE_PROJECT_ID: qukdfjeupjhpthfbaonv
      SUPABASE_URL: https://qukdfjeupjhpthfbaonv.supabase.co
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
          sparse-checkout: |
            /scripts/supabase/deploy-media.mjs
            /supabase/migrations/20261001032427_add_complete_nasm_exercise_library.sql
            /supabase/storage-assets/manifest.json
            /supabase/storage-assets/exercise-images/anatomy/2026-11-24/seated-dip-machine.webp
            /supabase/storage-assets/exercise-images/approved/2026-11-24/motion-webp/seated-dip-machine.webp
          sparse-checkout-cone-mode: false
      - name: Validate the two exact versioned assets
        run: |
          node --input-type=module <<'JS'
          import { createHash } from 'node:crypto';
          import { readFileSync, writeFileSync } from 'node:fs';
          import { strict as assert } from 'node:assert';

          const manifest = JSON.parse(readFileSync('supabase/storage-assets/manifest.json', 'utf8'));
          const expected = new Map([
            ['anatomy/2026-11-24/seated-dip-machine.webp', 'f3e0fbd11bfce6e40cf163a3f73dd3ee22cb363dd2bcbf816d2a032238ea6a83'],
            ['approved/2026-11-24/motion-webp/seated-dip-machine.webp', '130086b959eea9ff98448e23e1dd67a0b36e46379cf2e1a737de4bb6bf8318c6'],
          ]);
          const assets = manifest.assets.filter(entry => entry.bucket === 'exercise-images' && expected.has(entry.objectPath));
          assert.equal(assets.length, expected.size);
          for (const asset of assets) {
            assert.equal(asset.source, 'supabase/storage-assets/exercise-images/' + asset.objectPath);
            assert.equal(asset.contentType, 'image/webp');
            assert.equal(createHash('sha256').update(readFileSync(asset.source)).digest('hex'), expected.get(asset.objectPath));
          }
          writeFileSync(process.env.RUNNER_TEMP + '/seated-dip-manifest.json', JSON.stringify({
            ...manifest, assets, migrations: [manifest.nasmExerciseCatalogMigration], exerciseMedia: [],
          }));
          JS
          node scripts/supabase/deploy-media.mjs validate "$RUNNER_TEMP/seated-dip-manifest.json"
      - name: Upload the two non-overwriting Storage objects
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_DEPLOY_TOKEN }}
        run: node scripts/supabase/deploy-media.mjs upload "$RUNNER_TEMP/seated-dip-manifest.json"
