name: Supabase production deploy

on:
  pull_request:
    paths:
      - 'scripts/supabase/**'
      - 'supabase/migrations/**'
      - 'supabase/storage-assets/**'
      - '.github/workflows/supabase-production.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/supabase/**'
      - 'supabase/migrations/**'
      - 'supabase/storage-assets/**'
      - '.github/workflows/supabase-production.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_ID: qukdfjeupjhpthfbaonv
  SUPABASE_URL: https://qukdfjeupjhpthfbaonv.supabase.co

jobs:
  validate:
    name: Validate media manifest
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Check uploader syntax
        run: node --check scripts/supabase/deploy-media.mjs
      - name: Validate assets and manifest
        run: node scripts/supabase/deploy-media.mjs validate

  deploy:
    name: Upload media and apply migrations
    needs: validate
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Require deployment credentials
        shell: bash
        run: |
          missing=0
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo '::error::Missing SUPABASE_ACCESS_TOKEN'
            missing=1
          fi
          exit "$missing"
      - name: Upload versioned media
        run: node scripts/supabase/deploy-media.mjs upload
      - name: Preview pending migrations
        run: node scripts/supabase/deploy-migrations.mjs dry-run
      - name: Apply pending migrations
        run: node scripts/supabase/deploy-migrations.mjs apply
      - name: Verify uploaded bytes and exercise mappings
        run: node scripts/supabase/deploy-media.mjs verify
