name: Deploy site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Static site releases are snapshots: when main advances, deploy the newest
  # snapshot instead of letting an older environment-waiting run block it.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir _site
          cp -R CNAME .nojekyll *.html *.png *.ico site.webmanifest client.webmanifest coach.webmanifest timer-notifications-sw.js css images js _site/
          mkdir -p _site/assets/mockups/fascia
          cp -R assets/mockups/fascia/client-web _site/assets/mockups/fascia/
          cp -R assets/mascots _site/assets/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Verify the Pages artifact is available
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT: github-pages-${{ github.run_attempt }}
        run: |
          for attempt in {1..8}; do
            ready=$(gh api --method GET "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              -f name="$PAGES_ARTIFACT" --jq '.artifacts[] | select(.expired == false) | .name') && \
              [[ "$ready" == "$PAGES_ARTIFACT" ]] && exit 0
            sleep 5
          done
          echo "::error::GitHub did not make the uploaded Pages artifact available."
          exit 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
          timeout: 600000
