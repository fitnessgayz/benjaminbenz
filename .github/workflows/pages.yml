name: Deploy site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Static site releases are snapshots: when main advances, deploy the newest
  # snapshot instead of letting an older environment-waiting run block it.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir _site
          cp -R CNAME .nojekyll *.html *.png *.ico site.webmanifest client.webmanifest coach.webmanifest timer-notifications-sw.js css images js _site/
          mkdir -p _site/assets/mockups/fascia
          cp -R assets/mockups/fascia/client-web _site/assets/mockups/fascia/
          cp -R assets/mascots _site/assets/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
