name: Deploy site to Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Static site releases are snapshots: when main advances, deploy the newest
  # snapshot instead of letting an older environment-waiting run block it.
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Prepare static site
        run: |
          mkdir _site
          cp -R CNAME .nojekyll *.html *.png *.ico site.webmanifest client.webmanifest coach.webmanifest timer-notifications-sw.js css images js _site/
          mkdir -p _site/assets/mockups/fascia
          cp -R assets/mockups/fascia/client-web _site/assets/mockups/fascia/
          cp -R assets/mascots _site/assets/

      - name: Upload artifact
        id: pages-artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_ARTIFACT_ID: ${{ steps.pages-artifact.outputs.artifact_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import time
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          def request(url, token, data=None):
              body = json.dumps(data).encode() if data is not None else None
              headers = {'Authorization': 'Bearer ' + token, 'Accept': 'application/json'}
              if body is not None:
                  headers['Content-Type'] = 'application/json'
              try:
                  with urlopen(Request(url, data=body, headers=headers), timeout=20) as response:
                      return json.load(response)
              except HTTPError as error:
                  raise RuntimeError(f'GitHub returned HTTP {error.code}') from None

          artifact_id = int(os.environ['PAGES_ARTIFACT_ID'])
          token = os.environ['GH_TOKEN']
          repo = f"{os.environ['GITHUB_API_URL']}/repos/{os.environ['GITHUB_REPOSITORY']}"
          artifact = request(f'{repo}/actions/artifacts/{artifact_id}', token)
          expected_name = 'github-pages-' + os.environ['GITHUB_RUN_ATTEMPT']
          if artifact['name'] != expected_name or artifact['expired']:
              raise SystemExit('GitHub did not return the artifact from this deployment attempt.')

          # The uploader's artifact ID avoids a second lookup in the Actions artifact service.
          oidc = request(os.environ['ACTIONS_ID_TOKEN_REQUEST_URL'], os.environ['ACTIONS_ID_TOKEN_REQUEST_TOKEN'])['value']
          url = f'{repo}/pages/deployments'
          deployment = request(url, token, {
              'artifact_id': artifact_id,
              'pages_build_version': os.environ['GITHUB_SHA'],
              'oidc_token': oidc,
          })
          deployment_url = f"{url}/{quote(str(deployment['id']), safe='')}"
          for _ in range(48):
              status = request(deployment_url, token)['status']
              if status == 'succeed':
                  with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
                      output.write(f"page_url={deployment['page_url']}\n")
                  print(f"Published {deployment['page_url']}")
                  break
              if status in {'deployment_failed', 'deployment_content_failed', 'deployment_cancelled', 'deployment_lost'}:
                  raise SystemExit(f'GitHub Pages deployment ended with {status}.')
              time.sleep(5)
          else:
              raise SystemExit('GitHub Pages did not confirm the deployment within four minutes.')
          PY
