<!DOCTYPE html>
<html lang="en" data-coach-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f2f4f6" />
  <script src="/js/coach-theme.js?v=1"></script>
  <title>Workout Logger | GRUNTR Coach</title>
  <meta name="description" content="Log client workouts in GRUNTR Coach." />
  <meta name="robots" content="noindex, nofollow, noarchive" />
  <link rel="icon" type="image/png" sizes="32x32" href="/images/gruntr/client-22e30eae/icon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/images/gruntr/client-22e30eae/icon-16.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/images/gruntr/client-22e30eae/icon-180.png" />
  <link rel="manifest" href="/coach.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="GRUNTR Coach" />
  <meta name="application-name" content="GRUNTR Coach" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css?v=client-view-shortcut-1&amp;coach-copy-weights=1&amp;gym-location=1&amp;electric-gold=2" />
  <link rel="stylesheet" href="/css/fwb-design-system.css?v=web-app-brand-1&amp;theme=deep-forest-2&amp;electric-gold=2" />
  <link rel="stylesheet" href="css/one-rep-max.css?v=2&amp;electric-gold=2" />
  <link rel="stylesheet" href="/css/fwb-dark-theme.css?v=coach-blue-gold-1" />
  <link rel="stylesheet" href="css/site-close-buttons.css?v=1" />
  <link rel="stylesheet" href="css/coach-workout-client-style.css?v=theme-1" />
  <link rel="stylesheet" href="/css/coach-brand.css?v=theme-1" />
  <link rel="stylesheet" href="css/coach-workspace.css?v=3" />
  <link rel="stylesheet" href="/css/coach-theme.css?v=1" />
</head>
<body class="dashboard-page coach-workout-log-page">
  <header class="coach-gcoach-header">
    <a class="coach-gcoach-icon" href="coach-admin.html?tab=home" aria-label="Back to Coach Home"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 5-7 7 7 7"/></svg></a>
    <h1 id="coach-workout-page-title">Log Workout</h1>
    <button class="coach-gcoach-icon" type="submit" form="coach-workout-log-form" id="coach-workout-save" aria-label="Save workout without closing" hidden><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 9H3v11h18V9h-2"/></svg></button>
  </header>

  <main class="admin-shell coach-workout-log-shell" aria-labelledby="coach-workout-page-title">
    <section class="admin-card coach-workout-access-status" id="coach-workout-access-status" role="status">
      Preparing GRUNTR Coach…
    </section>

    <form class="coach-workout-logger" id="coach-workout-log-form" hidden>
      <div class="coach-gcoach-workout" id="coach-workout-main-panel">
      <div class="coach-gcoach-workout-scroll" role="region" aria-label="Workout details and exercises" tabindex="0">
      <section class="coach-workout-client-search" aria-labelledby="coach-workout-client-search-title">
        <label id="coach-workout-client-search-title" for="coach-workout-client-name">Find a client</label>
        <div class="coach-workout-client-control">
          <input type="text" id="coach-workout-client-name" list="coach-workout-client-suggestions" placeholder="Search clients" required autocomplete="off" />
          <datalist id="coach-workout-client-suggestions"></datalist>
          <select id="coach-workout-client" hidden aria-hidden="true" tabindex="-1">
            <option value="">Choose a client</option>
          </select>
          <a class="button coach-client-view-link" id="coach-workout-client-view" target="_blank" rel="noopener" hidden><span class="coach-gcoach-client-view-text">View client page</span> <span aria-hidden="true">↗</span></a>
        </div>
      </section>
      <div class="coach-gcoach-tools">
      <details class="coach-gcoach-tool">
        <summary><span aria-hidden="true">◆</span><span data-coach-gym-label>Gym</span></summary>
        <div class="coach-gcoach-popover">
          <label for="coach-workout-gym">Gym location</label>
          <input type="text" id="coach-workout-gym" list="coach-workout-gym-suggestions" maxlength="80" placeholder="Gym, Home, or Outdoors" autocomplete="off" />
          <datalist id="coach-workout-gym-suggestions"><option value="Home"></option><option value="Outdoors"></option></datalist>
        </div>
      </details>
      <details class="coach-gcoach-tool">
        <summary><span aria-hidden="true">◇</span><span data-coach-format-label>Straight Sets</span></summary>
        <div class="coach-gcoach-popover">
          <fieldset class="coach-workout-format-fieldset">
            <legend>Workout format</legend>
            <div class="coach-workout-format-options">
              <label><input type="radio" name="coach_workout_format" value="single" checked required /><span><strong>Straight sets</strong></span></label>
              <label><input type="radio" name="coach_workout_format" value="superset" required /><span><strong>Superset</strong></span></label>
              <label><input type="radio" name="coach_workout_format" value="circuit" required /><span><strong>Circuit</strong></span></label>
            </div>
          </fieldset>
        </div>
      </details>
      <details class="coach-gcoach-tool coach-gcoach-settings">
        <summary aria-label="Workout settings"><span aria-hidden="true">⚙</span></summary>
        <div class="coach-gcoach-popover">
        <div class="coach-workout-session-grid">
          <label>
            Workout date
            <input type="date" id="coach-workout-date" required />
          </label>
        </div>
        <div class="coach-gcoach-settings-brand"><img class="coach-brand-logo" src="/images/gruntr/client-22e30eae/icon-192.png" alt="" width="32" height="32" /><span>GRUNTR Coach</span><span class="status-pill">Autosave on</span></div>
        <button class="button button-ghost sign-out-button" type="button" data-coach-workout-sign-out hidden>Sign Out</button>
        </div>
      </details>
      </div>
      <button class="coach-gcoach-rest" type="button" id="coach-workout-start-rest" aria-controls="coach-rest-timer"><span aria-hidden="true">◷</span> Rest timer</button>

      <section class="admin-card coach-workout-exercise-section" aria-labelledby="coach-workout-exercises-title">
        <div class="admin-section-heading">
          <div>
            <p class="kicker">Required</p>
            <h2 id="coach-workout-exercises-title">Your exercises</h2>
            <p>Build as you go.</p>
          </div>
        </div>
        <div class="coach-workout-carousel" id="coach-workout-carousel" data-coach-workout-format="single">
          <button class="coach-workout-first-exercise" id="coach-workout-first-exercise" type="button" hidden>
            <span aria-hidden="true">+</span>
            <strong>Add first exercise</strong>
            <small>Build your workout as you go</small>
          </button>
          <div class="coach-workout-group-stack" id="coach-workout-group-stack" data-coach-workout-group-stack hidden></div>
          <div class="coach-workout-exercise-list" id="coach-workout-exercises" aria-live="polite"></div>
        </div>
        <button class="button button-ghost coach-workout-add-exercise" type="button" id="coach-workout-add-exercise"><span aria-hidden="true">⊕</span> Add Exercise</button>
      </section>
      </div>

      <section class="admin-card coach-workout-submit-panel">
        <aside class="coach-rest-timer" id="coach-rest-timer" aria-label="Rest timer" hidden>
          <div class="coach-rest-timer-heading">
            <strong id="coach-rest-timer-status" role="status">Rest timer</strong>
            <output id="coach-rest-timer-display" aria-label="Time remaining" aria-live="off">01:00</output>
          </div>
          <div class="coach-rest-timer-controls">
            <label>Rest duration
              <select id="coach-rest-timer-duration">
                <option value="30">30 sec</option><option value="60" selected>60 sec</option><option value="90">90 sec</option><option value="120">2 min</option><option value="180">3 min</option>
              </select>
            </label>
            <button type="button" id="coach-rest-timer-toggle">Pause</button>
            <button type="button" id="coach-rest-timer-skip">Skip</button>
          </div>
        </aside>
        <p id="coach-workout-status" role="status">Autosave is on. Choose a client and add the exercises completed today.</p>
        <div class="coach-workout-submit-actions">
          <button class="button button-ghost" type="button" id="coach-workout-reset" aria-label="Clear form" title="Clear form"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M9 6V3h6v3m-9 0 1 15h10l1-15M10 10v7m4-7v7"/></svg></button>
          <div class="coach-workout-save-actions">
            <button class="button coach-workout-finish-button" type="button" id="coach-workout-finish">Finish Workout</button>
          </div>
        </div>
      </section>
      </div>
      <section class="coach-gcoach-library" id="coach-workout-library-panel" aria-labelledby="coach-workout-library-title" hidden>
        <div class="coach-gcoach-picker-heading"><h2 id="coach-workout-library-title">Add Exercise</h2><button type="button" id="coach-workout-library-close">Back to workout</button></div>
        <label for="coach-workout-library-search">Find an exercise</label>
        <input id="coach-workout-library-search" type="search" placeholder="Search by exercise or muscle" autocomplete="off" aria-controls="coach-workout-library-results" />
        <div class="coach-gcoach-library-tools"><p data-coach-workout-library-status role="status"></p><button type="button" data-coach-workout-custom-exercise>Type a custom exercise</button></div>
        <ul id="coach-workout-library-results" aria-label="Exercises"></ul>
        <button type="button" class="button button-ghost" data-coach-workout-library-more hidden>Show more exercises</button>
      </section>
    </form>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabase-config.js?v=client-session-link-1"></script>
  <script src="js/auth-session.js?v=remember-login-2"></script>
  <script src="js/coach-rest-timer.js?v=inline-rest-1"></script>
  <script src="js/one-rep-max.js?v=2"></script>
  <script src="js/coach-workout-log.js?v=client-view-shortcut-1&amp;remember-login=1&amp;coach-copy-weights=1&amp;blank-zero=1&amp;recovery-catalog=1&amp;gym-location=1&amp;client-layout=6"></script>
</body>
</html>
