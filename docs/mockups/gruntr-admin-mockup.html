<div id="gruntr-admin-mockup">
  <style>
    #gruntr-admin-mockup {
      color-scheme: light dark;
      --ga-canvas: light-dark(#f4f6f8, #101113);
      --ga-panel: light-dark(#fff, #191c20);
      --ga-raised: light-dark(#edf1f5, #242931);
      --ga-ink: light-dark(#151b22, #f4f6f9);
      --ga-subtle: light-dark(#4e5a67, #b3bcc8);
      --ga-line: light-dark(#d6dce4, #353e4a);
      --ga-gold: #ffcf24;
      --ga-gold-ink: #211800;
      --ga-blue: light-dark(#06578e, #83c8ff);
      --ga-review: light-dark(#875115, #ffd18d);
      color: var(--ga-ink);
      font: 14px/1.48 system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      min-width: 0;
    }
    #gruntr-admin-mockup *, #gruntr-admin-mockup *::before, #gruntr-admin-mockup *::after { box-sizing: border-box; }
    #gruntr-admin-mockup [hidden] { display: none !important; }
    #gruntr-admin-mockup h1, #gruntr-admin-mockup h2, #gruntr-admin-mockup h3,
    #gruntr-admin-mockup p { margin: 0; }
    #gruntr-admin-mockup h1 { font-size: clamp(22px, 4vw, 29px); font-weight: 730; line-height: 1.16; letter-spacing: -.025em; }
    #gruntr-admin-mockup h2 { font-size: 18px; font-weight: 700; }
    #gruntr-admin-mockup h3 { font-size: 15px; line-height: 1.3; font-weight: 700; }
    #gruntr-admin-mockup button, #gruntr-admin-mockup input,
    #gruntr-admin-mockup select, #gruntr-admin-mockup textarea { color: inherit; font: inherit; }
    #gruntr-admin-mockup .ga-shell { background: var(--ga-canvas); border-radius: 12px; min-width: 0; }
    #gruntr-admin-mockup .ga-header {
      background: var(--ga-panel); border-bottom: 1px solid var(--ga-line);
      border-radius: 12px 12px 0 0; padding: 14px clamp(12px, 3vw, 24px);
      display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 11px;
    }
    #gruntr-admin-mockup .ga-brand, #gruntr-admin-mockup .ga-tools,
    #gruntr-admin-mockup .ga-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    #gruntr-admin-mockup .ga-brand { font-size: 17px; font-weight: 750; gap: 10px; }
    #gruntr-admin-mockup .ga-brand img { display: block; width: 34px; height: 34px; border-radius: 8px; }
    #gruntr-admin-mockup .ga-demo { font-size: 12px; color: var(--ga-subtle); white-space: nowrap; }
    #gruntr-admin-mockup .ga-main { padding: clamp(12px, 3vw, 24px); }
    #gruntr-admin-mockup .ga-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 21px; }
    #gruntr-admin-mockup .ga-btn, #gruntr-admin-mockup .ga-nav button {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      min-height: 38px; padding: 7px 11px; background: var(--ga-raised);
      border: 1px solid var(--ga-line); border-radius: 8px; text-align: center; font-weight: 620;
    }
    #gruntr-admin-mockup .ga-btn--quiet { background: transparent; }
    #gruntr-admin-mockup .ga-btn--gold, #gruntr-admin-mockup .ga-nav button[aria-pressed="true"] {
      background: var(--ga-gold); border-color: var(--ga-gold); color: var(--ga-gold-ink);
    }
    #gruntr-admin-mockup .ga-nav button[aria-pressed="false"]:hover,
    #gruntr-admin-mockup .ga-btn:hover, #gruntr-admin-mockup .ga-city:hover,
    #gruntr-admin-mockup .ga-club:hover { box-shadow: inset 0 0 0 1px currentColor; }
    #gruntr-admin-mockup .ga-heading {
      display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 9px; margin-bottom: 13px;
    }
    #gruntr-admin-mockup .ga-grid {
      display: grid; grid-template-columns: minmax(190px, .8fr) minmax(0, 1.9fr); align-items: start; gap: 12px;
    }
    #gruntr-admin-mockup .ga-panel {
      min-width: 0; padding: 14px; border: 1px solid var(--ga-line); border-radius: 10px; background: var(--ga-panel);
    }
    #gruntr-admin-mockup .ga-city-search { display: grid; gap: 5px; margin: 11px 0 8px; }
    #gruntr-admin-mockup .ga-meta { color: var(--ga-subtle); font-size: 12px; }
    #gruntr-admin-mockup .ga-input, #gruntr-admin-mockup select {
      background: var(--ga-canvas); border: 1px solid var(--ga-line); border-radius: 7px; min-width: 0;
      padding: 6px 9px; min-height: 38px;
    }
    #gruntr-admin-mockup .ga-input { width: 100%; }
    #gruntr-admin-mockup .ga-stack { display: grid; gap: 8px; }
    #gruntr-admin-mockup .ga-city, #gruntr-admin-mockup .ga-club {
      padding: 8px 10px; min-width: 0; text-align: left; background: var(--ga-raised);
      border: 1px solid var(--ga-line); border-radius: 7px; display: grid; gap: 2px; width: 100%;
    }
    #gruntr-admin-mockup .ga-city[aria-pressed="true"], #gruntr-admin-mockup .ga-club[aria-pressed="true"] {
      border-color: var(--ga-blue);
    }
    #gruntr-admin-mockup .ga-clubs {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 135px), 1fr)); gap: 6px; margin: 10px 0 0;
    }
    #gruntr-admin-mockup .ga-board { border-top: 1px solid var(--ga-line); margin-top: 14px; padding-top: 12px; }
    #gruntr-admin-mockup .ga-board .ga-heading { margin-bottom: 8px; }
    #gruntr-admin-mockup .ga-list { display: grid; gap: 8px; margin: 0; list-style: none; padding: 0; }
    #gruntr-admin-mockup .ga-row {
      min-width: 0; display: grid; gap: 7px; padding: 10px; border: 1px solid var(--ga-line); border-radius: 8px;
      background: var(--ga-canvas); overflow-wrap: anywhere;
    }
    #gruntr-admin-mockup .ga-reports .ga-row { background: var(--ga-panel); }
    #gruntr-admin-mockup .ga-row-title {
      display: flex; justify-content: space-between; align-items: flex-start; flex-wrap: wrap; gap: 4px 9px;
    }
    #gruntr-admin-mockup .ga-row .ga-btn { padding: 6px 8px; min-height: 34px; font-size: 13px; }
    #gruntr-admin-mockup .ga-flag { color: var(--ga-review); font-weight: 650; }
    #gruntr-admin-mockup .ga-quote { border-inline-start: 2px solid var(--ga-line); padding-inline-start: 9px; }
    #gruntr-admin-mockup .ga-profile-card { display: grid; gap: 12px; }
    #gruntr-admin-mockup .ga-member-identity { display: flex; align-items: center; gap: 10px; min-width: 0; }
    #gruntr-admin-mockup .ga-member-avatar {
      display: grid; place-items: center; flex: 0 0 42px; width: 42px; height: 42px;
      overflow: hidden; border-radius: 9px; background: var(--ga-raised); color: var(--ga-subtle);
    }
    #gruntr-admin-mockup .ga-member-avatar img { width: 100%; height: 100%; object-fit: cover; }
    #gruntr-admin-mockup .ga-profile-facts {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 120px), 1fr));
      gap: 10px; margin: 0;
    }
    #gruntr-admin-mockup .ga-profile-facts dd { margin: 1px 0 0; font-weight: 650; }
    #gruntr-admin-mockup .ga-profile-block { border-top: 1px solid var(--ga-line); padding-top: 10px; display: grid; gap: 7px; }
    #gruntr-admin-mockup .ga-member-notice { white-space: pre-wrap; overflow-wrap: anywhere; }
    #gruntr-admin-mockup .ga-compose-form { display: grid; gap: 8px; }
    #gruntr-admin-mockup .ga-compose-form textarea {
      width: 100%; min-height: 100px; resize: vertical; border-radius: 7px;
      background: var(--ga-canvas); border: 1px solid var(--ga-line); padding: 7px 9px;
    }
    #gruntr-admin-mockup button:disabled { opacity: .58; }
    #gruntr-admin-mockup .ga-report-scope { margin: 0 0 9px; }
    #gruntr-admin-mockup .ga-approvals .ga-row { background: var(--ga-panel); }
    #gruntr-admin-mockup .ga-email-status { font-size: 12px; font-weight: 600; color: var(--ga-subtle); }
    #gruntr-admin-mockup .ga-photos {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 172px), 1fr)); gap: 9px; margin-top: 10px;
    }
    #gruntr-admin-mockup .ga-photo { background: var(--ga-panel); }
    #gruntr-admin-mockup .ga-thumb {
      border: 0; border-radius: 6px; background: var(--ga-raised); overflow: hidden; min-width: 0;
      padding: 0; width: 100%; height: 165px;
    }
    #gruntr-admin-mockup .ga-thumb img { display: block; width: 100%; height: 100%; object-fit: contain; }
    #gruntr-admin-mockup .ga-photo .ga-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
    #gruntr-admin-mockup .ga-photo .ga-actions button { min-width: 0; }
    #gruntr-admin-mockup .ga-dialog {
      width: min(94%, 405px); max-height: 88vh; border: 1px solid var(--ga-line);
      border-radius: 11px; background: var(--ga-panel); color: var(--ga-ink); padding: 13px;
    }
    #gruntr-admin-mockup .ga-dialog::backdrop { background: light-dark(#18233275, #090b0db5); }
    #gruntr-admin-mockup .ga-dialog img { width: 100%; max-height: 67vh; object-fit: contain; display: block; border-radius: 6px; }
    #gruntr-admin-mockup .ga-feedback { font-size: 12px; color: var(--ga-blue); margin-top: 9px; }
    #gruntr-admin-mockup .ga-feedback:empty { display: none; }
    @media (max-width: 620px) {
      #gruntr-admin-mockup .ga-grid { grid-template-columns: minmax(0, 1fr); }
      #gruntr-admin-mockup .ga-city-list { grid-template-columns: repeat(auto-fit, minmax(min(100%, 130px), 1fr)); }
      #gruntr-admin-mockup .ga-nav { margin-bottom: 15px; }
    }
    @media (max-width: 410px) {
      #gruntr-admin-mockup .ga-brand { font-size: 16px; }
      #gruntr-admin-mockup .ga-nav button { padding-inline: 8px; }
      #gruntr-admin-mockup .ga-photos { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      #gruntr-admin-mockup .ga-photo .ga-btn { padding-inline: 3px; }
      #gruntr-admin-mockup .ga-thumb { height: 115px; }
      #gruntr-admin-mockup .ga-panel { padding: 11px; }
    }
    @media (pointer: coarse) {
      #gruntr-admin-mockup .ga-btn, #gruntr-admin-mockup .ga-nav button,
      #gruntr-admin-mockup .ga-row .ga-btn, #gruntr-admin-mockup select,
      #gruntr-admin-mockup input { min-height: 44px; }
      #gruntr-admin-mockup input, #gruntr-admin-mockup textarea { font-size: 16px; }
    }
  </style>

        state.signupDecisions = Object.fromEntries(signups.flatMap((signup) => {
          const status = data.signupDecisions?.[signup.id];
          return status === "rejected" || (status === "approved" && signup.verified) ? [[signup.id, status]] : [];
        }));
        state.reportType = reportTypes.has(data.reportType) ? data.reportType : "all";
        state.reportMember = getMember(data.reportMember)?.id ?? null;
        state.member = getMember(data.member)?.id ?? members[0].id;
        state.hidden = new Set(posts.filter((post) => Array.isArray(data.hidden) && data.hidden.includes(post.id)).map((post) => post.id));
        state.decided = new Set(photos.filter((photo) => Array.isArray(data.decided) && data.decided.includes(photo.id)).map((photo) => photo.id));
        state.reportStatus = Object.fromEntries(reports.flatMap((report) => {
          const status = data.reportStatus?.[report.id];
          return status === "resolved" || status === "dismissed" ? [[report.id, status]] : [];
        }));
        state.screened = data.screened === true;
        state.coach = data.coach === true;
      }
      function save() {
        if (!window.openai?.setWidgetState) return;
        const selection = { section: state.tab };
        if (state.tab === "groups") Object.assign(selection, { city: selectedCity().name, club: selectedClub().name });
        if (state.tab === "profiles") selection.member = getMember(state.member).name;
        if (state.tab === "reports") Object.assign(selection, { type: state.reportType, status: state.filter });
        if (state.tab === "approvals") selection.status = state.signupFilter;
        window.openai.setWidgetState({
          modelContent: state.coach ? { workspace: "Coach" } : selection,
          privateContent: { ...state, hidden: [...state.hidden], decided: [...state.decided] }
        }).catch(() => {});
      }
      function feedback(message) { read("feedback").textContent = message; }
      function changed(message = "") {
        render();
        feedback(message);
        save();
      }
      function selection(title, detail, active, onSelect, className) {
        const el = action("", onSelect, className);
        el.setAttribute("aria-pressed", String(active));
        el.append(node("strong", "", title), node("span", "ga-meta", detail));
        return el;
      }
      function visibilityAction(post) {
        return action(state.hidden.has(post.id) ? "Restore post" : "Hide post", () => {
          const hidden = state.hidden.has(post.id);
          if (hidden) state.hidden.delete(post.id);
          else state.hidden.add(post.id);
          changed(hidden ? "Post restored in the demo." : "Post hidden in the demo.");
        });
      }
      function renderCities() {
        const search = read("search").value.trim().toLowerCase();
        const visible = cities.filter((city) => city.name.toLowerCase().includes(search));
        const rows = visible.map((city) => {
          const open = countOpen(getPosts(city.id).map((post) => post.id));
          const detail = city.clubs.length + " clubs · " + open + (open === 1 ? " open report" : " open reports");
          return selection(city.name, detail, state.city === city.id, () => {
            state.city = city.id;
            state.club = city.clubs[0].id;
            changed();
            read("cities").querySelector('[aria-pressed="true"]')?.focus({ preventScroll: true });
          }, "ga-city");
        });
        read("cities").replaceChildren(...(rows.length ? rows : [node("p", "ga-meta", "No matching cities.")]));
      }
      function renderGroups() {
        const city = selectedCity();
        const club = selectedClub();
        renderCities();
        read("city-name").textContent = city.name;
        read("club-name").textContent = club.name + " posts";
        read("clubs").replaceChildren(...city.clubs.map((item) =>
          selection(item.name, item.members + " members", item.id === club.id, () => {
            state.club = item.id;
            changed();
            read("clubs").querySelector('[aria-pressed="true"]')?.focus({ preventScroll: true });
          }, "ga-club")));
        const rows = getPosts(city.id, club.id).map((post) => {
          const li = node("li", "ga-row");
          const title = node("div", "ga-row-title");
          const open = countOpen([post.id]);
          title.append(node("strong", "", post.author), node("span", "ga-meta", post.time));
          li.append(title, node("p", "", post.body));
          const actions = node("div", "ga-actions");
          actions.append(visibilityAction(post));
          if (state.hidden.has(post.id)) actions.append(node("span", "ga-meta ga-flag", "Hidden"));
          if (open) actions.append(node("span", "ga-meta ga-flag", open + (open === 1 ? " open report" : " open reports")));
          li.append(actions);
          return li;
        });
        read("posts").replaceChildren(...(rows.length ? rows : [node("li", "ga-meta", "No posts in this club yet.")]));
      }
      function memberAvatar(member, photoId) {
        const avatar = node("span", "ga-member-avatar");
        avatar.setAttribute("aria-hidden", "true");
        const photo = photos.find((item) => item.id === photoId);
        if (photo) {
          const image = node("img");
          image.src = photo.src;
          image.alt = "";
          avatar.append(image);
        } else {
          avatar.textContent = member.name.split(" ").map((part) => part[0]).join("");
        }
        return avatar;
      }
      function focusSelectedMember() {
        read("member-list").querySelector('[aria-pressed="true"]')?.focus({ preventScroll: true });
      }
      function openMemberProfile(id) {
        state.member = id;
        state.tab = "profiles";
        read("member-search").value = "";
        changed();
        focusSelectedMember();
      }
      function renderMemberList() {
        const query = read("member-search").value.trim().toLowerCase();
        const matching = approvedMembers().filter((member) => (member.name + " " + member.username).toLowerCase().includes(query));
        const rows = matching.map((member) => {
          const count = openMemberReports(member.id).length;
          const detail = count ? member.username + " · " + count + (count === 1 ? " open report" : " open reports") : member.username;
          return selection(member.name, detail, state.member === member.id, () => {
            state.member = member.id;
            changed();
            focusSelectedMember();
          }, "ga-city");
        });
        read("member-list").replaceChildren(...(rows.length ? rows : [node("p", "ga-meta", "No matching members.")]));
      }
      function openMemberMessage(member, trigger) {
        messageTarget = member;
        messageTrigger = trigger;
        read("recipient").textContent = "To " + member.name + " · " + member.username;
        const body = read("message-body");
        body.value = "";
        read("send-message").disabled = true;
        messageDialog.showModal();
        body.focus();
      }
      function renderProfiles() {
        renderMemberList();
        const member = getMember(state.member);
        const identity = node("div", "ga-member-identity");
        const name = node("div");
        name.append(node("h2", "", member.name), node("p", "ga-meta", member.username));
        identity.append(memberAvatar(member, member.avatar), name);

        const facts = node("dl", "ga-profile-facts");
        for (const [label, value] of [["Joined", member.joined], ["Open reports", String(openMemberReports(member.id).length)]]) {
          const fact = node("div");
          fact.append(node("dt", "ga-meta", label), node("dd", "", value));
          facts.append(fact);
        }

        const spotter = node("div", "ga-profile-block");
        spotter.append(node("h3", "", "Spotter profile"));
        if (member.spotterName) {
          const linkedIdentity = node("div", "ga-member-identity");
          linkedIdentity.append(memberAvatar(member, member.spotterPhoto), node("strong", "", member.spotterName));
          spotter.append(linkedIdentity);
        } else {
          spotter.append(node("p", "ga-meta", "No Spotter profile"));
        }

        const actions = node("div", "ga-actions");
        actions.append(action("View reports", () => {
          state.reportMember = member.id;
          state.reportType = "all";
          state.filter = "all";
          state.tab = "reports";
          changed();
          read("clear-report-scope").focus({ preventScroll: true });
        }), action("Message member", (event) => openMemberMessage(member, event.currentTarget), "ga-btn ga-btn--gold"));

        const history = node("div", "ga-profile-block");
        history.append(node("h3", "", "Admin messages"));
        const messages = notices.get(member.id) || [];
        if (messages.length) {
          for (const message of messages) {
            history.append(node("p", "ga-quote ga-member-notice", message));
          }
        } else {
          history.append(node("p", "ga-meta", "No admin messages yet."));
        }
        read("profile-details").replaceChildren(identity, facts, spotter, actions, history);
      }
      function decideSignup(signup, decision) {
        if (signupStatus(signup.id) !== "pending" || (decision === "approved" && !signup.verified)) return;
        state.signupDecisions[signup.id] = decision;
        changed(signup.name + "’s signup was " + decision + " in the demo.");
        const nextAction = read("signups").querySelector("button:not(:disabled)");
        (nextAction || read("signup-filter")).focus({ preventScroll: true });
      }
      function renderApprovals() {
        const pendingCount = signups.filter((signup) => signupStatus(signup.id) === "pending").length;
        read("signup-count").textContent = pendingCount + (pendingCount === 1 ? " signup awaiting review" : " signups awaiting review");
        const matching = signups.filter((signup) => signupStatus(signup.id) === state.signupFilter);
        const rows = matching.map((signup) => {
          const row = node("li", "ga-row");
          const title = node("div", "ga-row-title");
          title.append(node("h3", "", signup.name), node("span", "ga-meta", "Signed up " + signup.joined));
          const emailStatus = node("p", "ga-email-status", signup.verified ? "Email verified" : "Waiting for email verification");
          row.append(title, node("p", "", signup.email + " · " + signup.username), emailStatus);
          const actions = node("div", "ga-actions");
          if (state.signupFilter === "pending") {
            const approve = action("Approve account", () => decideSignup(signup, "approved"), "ga-btn ga-btn--gold");
            approve.disabled = !signup.verified;
            actions.append(approve, action("Reject account", () => decideSignup(signup, "rejected")));
          } else if (state.signupFilter === "approved") {
            actions.append(action("View profile", () => openMemberProfile(signup.id)));
          }
          if (actions.childElementCount) row.append(actions);
          return row;
        });
        read("signups").replaceChildren(...(rows.length ? rows : [node("li", "ga-meta", "No " + state.signupFilter + " signups.")]));
      }
      function renderReports() {
        const scopedMember = getMember(state.reportMember);
        read("report-scope").hidden = !scopedMember;
        read("report-scope-name").textContent = scopedMember ? "Reports for " + scopedMember.name : "";
        const matching = reports.filter((report) =>
          (state.filter === "all" || reportStatus(report.id) === state.filter)
          && (state.reportType === "all" || report.kind === state.reportType)
          && (!scopedMember || report.member === scopedMember.id));
        const listings = matching.map((report) => {
          const row = node("li", "ga-row");
          const title = node("div", "ga-row-title");
          title.append(node("h3", "", report.reason), node("span", "ga-meta", report.time));
          const status = reportStatus(report.id);
          const suffix = status === "open" ? "" : " · " + (status === "resolved" ? "Resolved" : "Dismissed");
          const actions = node("div", "ga-actions");
          row.append(title);
          if (report.kind === "club") {
            const post = getPost(report.post);
            const city = cities.find((item) => item.id === post.city);
            const club = city.clubs.find((item) => item.id === post.club);
            const quote = node("div", "ga-quote");
            quote.append(node("p", "ga-meta", post.author), node("p", "", post.body));
            row.append(node("p", "ga-meta", city.name + " · " + club.name + suffix), node("p", "", report.note), quote);
            actions.append(visibilityAction(post));
          } else {
            const member = getMember(report.member);
            row.append(node("p", "ga-meta", member.name + " · " + member.username + suffix), node("p", "", report.note));
            if (report.excerpt) {
              const quote = node("div", "ga-quote");
              quote.append(node("p", "ga-meta", "Reported message"), node("p", "", report.excerpt));
              row.append(quote);
            }
            actions.append(action("View profile", () => openMemberProfile(member.id)),
              action("Message member", (event) => openMemberMessage(member, event.currentTarget)));
          }
          if (status === "open") {
            actions.append(action("Resolve", () => { state.reportStatus[report.id] = "resolved"; changed("Report resolved in the demo."); }),
              action("Dismiss", () => { state.reportStatus[report.id] = "dismissed"; changed("Report dismissed in the demo."); }));
          }
          row.append(actions);
          return row;
        });
        read("reports").replaceChildren(...(listings.length ? listings : [node("li", "ga-meta", "No reports match these filters.")]));
      }
      function openPhoto(photo, trigger) {
        thumbnailTrigger = trigger;
        root.querySelector("#ga-preview-title").textContent = photo.name + " · " + photo.kind;
        const image = read("preview-image");
        image.src = photo.src;
        image.alt = "Demo photo of " + photo.name;
        modal.showModal();
      }
      function renderPhotos() {
        const pending = pendingPhotos();
        if (state.screened) pending.sort((a, b) => Number(a.signal !== "Needs a closer look") - Number(b.signal !== "Needs a closer look"));
        read("photo-count").textContent = pending.length + (pending.length === 1 ? " photo awaiting review" : " photos awaiting review");
        root.querySelector('[data-ga-action="screen"]').disabled = state.screened || pending.length === 0;
        const all = root.querySelector('[data-ga-action="approve-all"]');
        const eligible = unflaggedPhotos().length;
        all.hidden = !state.screened || !eligible;
        all.textContent = "Approve all unflagged (" + eligible + ")";
        const rows = pending.map((photo) => {
          const row = node("li", "ga-row ga-photo");
          const trigger = action("", () => openPhoto(photo, trigger), "ga-thumb");
          trigger.setAttribute("aria-label", "Enlarge " + photo.name + "’s " + photo.kind.toLowerCase());
          const picture = node("img");
          picture.src = photo.src;
          picture.alt = "";
          trigger.append(picture);
          row.append(trigger, node("strong", "", photo.name), node("p", "ga-meta", photo.kind));
          if (state.screened) row.append(node("p", "ga-meta" + (photo.signal === "Needs a closer look" ? " ga-flag" : ""), photo.signal));
          const decisions = node("div", "ga-actions");
          for (const decision of ["Reject", "Approve"]) {
            const control = action(decision, () => {
              state.decided.add(photo.id);
              changed(photo.name + "’s photo was " + (decision === "Approve" ? "approved" : "rejected") + " in the demo.");
            }, decision === "Approve" ? "ga-btn ga-btn--gold" : "ga-btn ga-btn--quiet");
            control.setAttribute("aria-label", decision + " " + photo.name + "’s " + photo.kind.toLowerCase());
            decisions.append(control);
          }
          row.append(decisions);
          return row;
        });
        read("photos").replaceChildren(...(rows.length ? rows : [node("li", "ga-meta", "No photos awaiting review.")]));
      }
      function render() {
        read("admin").hidden = state.coach;
        read("coach").hidden = !state.coach;
        read("brand").textContent = state.coach ? "GRUNTR Coach" : "GRUNTR Admin";
        const workspace = root.querySelector(".ga-header [data-ga-action=workspace]");
        workspace.hidden = state.coach;
        readAll("tab").forEach((item) => item.setAttribute("aria-pressed", String(item.dataset.gaTab === state.tab)));
        readAll("section").forEach((section) => { section.hidden = section.dataset.gaSection !== state.tab; });
        read("filter").value = state.filter;
        read("report-type").value = state.reportType;
        read("signup-filter").value = state.signupFilter;
        if (state.coach) return;
        if (state.tab === "groups") renderGroups();
        if (state.tab === "profiles") renderProfiles();
        if (state.tab === "approvals") renderApprovals();
        if (state.tab === "reports") renderReports();
        if (state.tab === "photos") renderPhotos();
      }
      readAll("tab").forEach((tab) => tab.addEventListener("click", () => { state.tab = tab.dataset.gaTab; changed(); }));
      read("search").addEventListener("input", renderCities);
      read("member-search").addEventListener("input", renderMemberList);
      read("signup-filter").addEventListener("change", (event) => { state.signupFilter = event.currentTarget.value; changed(); });
      read("filter").addEventListener("change", (event) => { state.filter = event.currentTarget.value; changed(); });
      read("report-type").addEventListener("change", (event) => { state.reportType = event.currentTarget.value; changed(); });
      read("clear-report-scope").addEventListener("click", () => {
        state.reportMember = null;
        changed();
        read("report-type").focus({ preventScroll: true });
      });
      root.querySelectorAll("[data-ga-action=workspace]").forEach((button) => button.addEventListener("click", () => {
        state.coach = !state.coach;
        changed();
      }));
      root.querySelector("[data-ga-action=screen]").addEventListener("click", () => {
        state.screened = true;
        changed("Sample screening complete.");
      });
      root.querySelector("[data-ga-action=approve-all]").addEventListener("click", () => {
        if (!state.screened) return;
        const batch = unflaggedPhotos();
        batch.forEach((photo) => state.decided.add(photo.id));
        changed(batch.length + (batch.length === 1 ? " sample photo approved." : " sample photos approved."));
      });
      read("close").addEventListener("click", () => modal.close());
      modal.addEventListener("close", () => {
        if (thumbnailTrigger?.isConnected) thumbnailTrigger.focus();
        thumbnailTrigger = null;
      });
      read("message-body").addEventListener("input", (event) => {
        read("send-message").disabled = !event.currentTarget.value.trim();
      });
      read("message-cancel").addEventListener("click", () => messageDialog.close());
      read("send-message").addEventListener("click", () => {
        const message = read("message-body").value.trim();
        if (!message || !messageTarget) return;
        const memberId = messageTarget.id;
        notices.set(memberId, [message, ...(notices.get(memberId) || [])]);
        messageDialog.close();
        if (state.tab === "profiles") {
          renderProfiles();
          read("profile-details").querySelector(".ga-btn--gold")?.focus({ preventScroll: true });
        }
        feedback("Demo message sent.");
      });
      messageDialog.addEventListener("close", () => {
        if (messageTrigger?.isConnected) messageTrigger.focus({ preventScroll: true });
        messageTrigger = null;
        messageTarget = null;
      });
      window.addEventListener("openai:set_globals", (event) => {
        const saved = event.detail?.globals?.widgetState;
        if (saved) { applySaved(saved); render(); }
      });
      applySaved(window.openai?.widgetState);
      render();
    })();
  </script>
</div>
