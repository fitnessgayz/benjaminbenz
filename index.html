<body class="homepage-v2 public-page login-page">
  <div class="page-frame">
    <div class="artwork" aria-hidden="true"><img id="home-art-image" src="images/home/anatomy/curl.png" alt="" fetchpriority="high"></div>
    <header class="site-header">
      <a class="brand" href="index.html" aria-label="Fitness with Benjamin home"><img src="images/home/fwb-logo-transparent.svg?v=2" alt=""><span>Fitness with<br>Benjamin</span></a>
      <a class="header-link" href="personal-training.html">Explore coaching <span aria-hidden="true">↗</span></a>
    </header>
    <main class="login-main">
      <div class="login-stack">
        <section class="login-panel" aria-labelledby="login-title">
          <p class="eyebrow"><span class="gold-dash"></span> FWB TRAINING · CLIENT ACCESS</p>
          <h1 id="login-title">Client <em>login.</em></h1>
          <p class="intro">Pick up where you left off with your plan.</p>
          <form id="home-login-form" class="login-form">
            <label for="home-email">Email</label>
            <input id="home-email" type="email" name="email" autocomplete="email" placeholder="you@example.com" required>
            <label for="home-password">Password</label>
            <input id="home-password" type="password" name="password" autocomplete="current-password" placeholder="Password" required>
            <label class="remember"><input type="checkbox" name="remember_me" value="true" checked> Keep me signed in</label>
            <button class="gold-button" type="submit">Sign in to FWB Training <span aria-hidden="true">→</span></button>
            <p id="home-login-status" class="login-status" role="status" aria-live="polite"></p>
          </form>
          <div class="account-links"><button id="home-reset-password" type="button">Forgot password?</button><a href="client-signup.html">Need a setup link?</a></div>
          <div class="training-route"><p>New to training with Benjamin?</p><a href="personal-training.html">Explore personal training <span aria-hidden="true">→</span></a></div>
        </section>
        <a class="coach-login-link" href="coach-login.html">Coach login <span aria-hidden="true">→</span></a>
      </div>
    </main>
    <footer class="site-footer"><span>© <span id="home-year"></span> Fitness with Benjamin</span><nav aria-label="Footer"><a href="fwb-training-support.html">Support</a><a href="fwb-training-privacy.html">Privacy</a></nav></footer>
  </div>
