<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#101113">
  <title>Spotter | GRUNTR</title>
  <link rel="icon" type="image/png" href="/images/gruntr/client-pulse-1380/icon-32.png?v=charcoal-1" data-client-light-icon="/images/gruntr/client-pulse-light/icon-32.png">
  <link rel="apple-touch-icon" href="/images/gruntr/client-pulse-1380/icon-180.png?v=charcoal-1" data-client-light-icon="/images/gruntr/client-pulse-light/icon-180.png">
  <link rel="manifest" href="/client.webmanifest?v=pulse-1380">
  <script src="/js/client-theme.js?v=light-icon-1"></script>
  <link rel="stylesheet" href="/css/client-spotter.css?v=3">
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script defer src="/js/supabase-config.js?v=manual-sessions-1"></script>
  <script defer src="/js/auth-session.js?v=remember-login-2"></script>
  <script defer src="/js/profile-photo-processor.js?v=1"></script>
  <script defer src="/js/client-spotter-profile.js?v=1"></script>
  <script defer src="/js/client-spotter-connections.js?v=1"></script>
  <script defer src="/js/client-spotter.js?v=2"></script>
</head>
<body class="spotter-page">
  <a class="spotter-skip" href="#spotter-content">Skip to Spotter</a>
  <header class="spotter-header">
    <a class="spotter-secondary spotter-back" href="/client-dashboard.html?tab=home">
      <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg><span>Back</span>
    </a>
    <h1><img alt="" width="32" height="32" src="/images/gruntr/client-pulse-1380/icon-192.png" data-client-light-icon="/images/gruntr/client-pulse-light/icon-192.png"> GRUNTR Spotter</h1>
  </header>
  <main id="spotter-content" class="spotter-content" tabindex="-1">
    <p class="spotter-feedback" data-spotter-notice role="status" aria-live="polite"></p>
    <p class="spotter-muted" data-spotter-loading role="status">Loading Spotter…</p>
    <section id="spotter-discover" class="spotter-stack" data-spotter-discover hidden aria-label="Discover"></section>
    <section id="spotter-network" class="spotter-stack" data-spotter-network hidden aria-label="Spotter connections"></section>
    <section id="spotter-profile" class="spotter-stack" data-spotter-profile hidden aria-label="Spotter profile"></section>
  </main>
  <nav aria-label="Spotter sections" class="spotter-navigation" data-spotter-navigation hidden>
    <div class="spotter-navigation-buttons">
      <button type="button" aria-label="Discover" aria-controls="spotter-discover" data-spotter-tab="discover">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M20 4l-5.5 5.5a3.5 3.5 0 1 0 0 5l1.5-1.5M12 12h.01"/></svg>
        <span class="spotter-navigation-label">Discover</span>
      </button>
      <button type="button" aria-label="Groups" aria-controls="spotter-network" data-spotter-tab="groups">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/><circle cx="9" cy="7" r="4"/></svg>
        <span class="spotter-navigation-label">Groups</span>
      </button>
      <button type="button" aria-label="Matches" aria-controls="spotter-network" data-spotter-tab="matches">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71m2.25 5.82a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span class="spotter-navigation-label">Matches</span>
      </button>
      <button type="button" aria-label="Profile" aria-controls="spotter-profile" data-spotter-tab="profile">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="10" r="3"/><path d="M6.4 19a6 6 0 0 1 11.2 0"/></svg>
        <span class="spotter-navigation-label">Profile</span>
      </button>
      <button type="button" aria-label="Inbox" aria-controls="spotter-network" data-spotter-tab="inbox">
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M3 13l3.5-7h11L21 13v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5zm0 0h5l2 2h4l2-2h5"/></svg>
        <span class="spotter-navigation-label">Inbox</span>
      </button>
    </div>
  </nav>
  <dialog class="spotter-dialog" aria-labelledby="spotter-dialog-title" data-spotter-dialog>
    <header class="spotter-heading-row">
      <h2 id="spotter-dialog-title" data-spotter-dialog-title></h2>
      <form method="dialog"><button class="spotter-secondary" type="submit">Close</button></form>
    </header>
    <div class="spotter-stack" data-spotter-dialog-content></div>
  </dialog>
</body>
</html>
